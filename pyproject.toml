[project]
name = "croprisk"
version = "0.1.0"
description = "Crop insurance claim risk in Brazil (PSR/SISSER + NASA POWER): pricing and early-warning models"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "Caio Goia" }]
dependencies = [
    "numpy==2.4.6",
    "pandas==3.0.6",
    "pyarrow==25.0.1",
    "scipy==1.17.1",
    "scikit-learn==1.9.1",
    "lightgbm==4.7.0",
    "requests==2.34.2",
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.0",
]

[project.optional-dependencies]
train = [
    "mlflow==3.17.0",
    "shap==0.51.0",
    "matplotlib==3.11.2",
    "xgboost==3.2.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
    "httpx==0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/croprisk"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
